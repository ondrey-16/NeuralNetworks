[project]
name = "neuralnetworks"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
    "ruff>=0.4.0",
    "ipynb>=0.5.1",
    "pip>=26.2.1",
    "ipykernel>=7.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PTH", "SIM", "C4", "W"]
ignore = []
